<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>itk様 広告配信レポート</title>
<style>
:root{--bg:#0E1116;--card:#161C24;--ink:#E7ECF2;--soft:#95A1B0;--line:#242C36;--accent:#3AA9B8;--err:#E4695A}
@media (prefers-color-scheme:light){:root{--bg:#F6F7F9;--card:#fff;--ink:#1B2129;--soft:#5A6472;--line:#E4E7EC;--accent:#0E6E7C}}
*{box-sizing:border-box}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
.lc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;
  box-shadow:0 12px 40px #0004}
.lc h1{font-size:17px;margin:0 0 4px;letter-spacing:.02em}
.lc p.d{font-size:12.5px;color:var(--soft);margin:0 0 18px;line-height:1.6}
.lc label{display:block;font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.06em;margin:0 0 6px}
.lc input{width:100%;font-size:15px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);outline:none}
.lc input:focus{border-color:var(--accent)}
.lc button{width:100%;margin-top:14px;font-size:14px;font-weight:800;padding:11px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;cursor:pointer}
.lc button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-size:12px;margin-top:10px;min-height:16px}
.hint{color:var(--soft);font-size:11px;margin-top:12px}
.lock-ico{font-size:22px;margin-bottom:8px}
</style>
<div id="lock">
  <form class="lc" id="lf" autocomplete="off">
    <div class="lock-ico">🔒</div>
    <h1>itk様 広告配信レポート</h1>
    <p class="d">閲覧にはパスワードが必要です。関係者のみ入力してください。</p>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">表示する</button>
    <div class="err" id="err"></div>
    
  </form>
</div>

const KEY = "dash_pw_v1";
function b2u(b){return Uint8Array.from(atob(b), c=>c.charCodeAt(0));}
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const akey = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2u(SALT), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(IV)}, akey, b2u(CT));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw, remember){
  const html = await decrypt(pw);          // 失敗すると例外
  if(remember){ try{sessionStorage.setItem(KEY, pw);}catch(e){} }
  document.open(); document.write(html); document.close();
}
document.getElementById("lf").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent=""; go.disabled=true; go.textContent="復号中…";
  try{ await tryPw(pw, true); }
  catch(ex){ err.textContent="パスワードが違います。"; go.disabled=false; go.textContent="表示する"; document.getElementById("pw").select(); }
});
// セッション中は再入力不要（タブを閉じると消える）
(async()=>{ try{ const s=sessionStorage.getItem(KEY); if(s){ await tryPw(s, false); } }catch(e){} })();
